name: Shadow Test Index

on:
  pull_request:
    paths:
      - 'Huggingface_sv/cbir_index*.npz'
  push:
    branches:
      - main
    paths:
      - 'Huggingface_sv/cbir_index*.npz'

jobs:
  shadow-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        working-directory: ./Huggingface_sv
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install statsmodels
          
      - name: Fetch previous index
        run: |
          git checkout HEAD^ -- Huggingface_sv/cbir_index.npz
          mv Huggingface_sv/cbir_index.npz Huggingface_sv/cbir_index_old.npz
          git checkout HEAD -- Huggingface_sv/cbir_index.npz
          
      - name: Run Shadow Test
        working-directory: ./Huggingface_sv
        run: |
          python scripts/shadow_test.py --current_index cbir_index_old.npz --new_index cbir_index.npz
